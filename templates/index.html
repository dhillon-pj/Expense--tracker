<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <header class="header">
            <h1>Expense Tracker</h1>
            <p class="subtitle">Track your finances with style</p>
        </header>

        <div class="summary-cards">
            <div class="card glass">
                <div class="card-icon income-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12h14M19 5l-7 7-7-7"/></svg></div>
                <div class="card-info">
                    <span class="card-label">Total Income</span>
                    <span class="card-value income" id="totalIncome">$0.00</span>
                </div>
            </div>
            <div class="card glass">
                <div class="card-icon expense-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14M5 5l7 7 7-7"/></svg></div>
                <div class="card-info">
                    <span class="card-label">Total Expense</span>
                    <span class="card-value expense" id="totalExpense">$0.00</span>
                </div>
            </div>
            <div class="card glass">
                <div class="card-icon balance-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></div>
                <div class="card-info">
                    <span class="card-label">Balance</span>
                    <span class="card-value balance" id="balance">$0.00</span>
                </div>
            </div>
        </div>

        <div class="main-grid">
            <section class="glass panel">
                <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add Transaction</h2>
                <form id="transactionForm">
                    <div class="form-group">
                        <label>Description</label>
                        <input type="text" id="description" placeholder="e.g., Salary, Groceries" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Amount</label>
                            <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required>
                        </div>
                        <div class="form-group">
                            <label>Type</label>
                            <select id="type" required>
                                <option value="income">Income</option>
                                <option value="expense">Expense</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="category" required>
                            <option value="">Select type first</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Transaction</button>
                </form>
            </section>

            <section class="glass panel">
                <div class="panel-header">
                    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg> Filters</h2>
                </div>
                <div class="filters">
                    <div class="filter-group">
                        <label>Type</label>
                        <select id="filterType">
                            <option value="">All</option>
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Category</label>
                        <select id="filterCategory">
                            <option value="">All</option>
                        </select>
                    </div>
                </div>
            </section>
        </div>

        <section class="glass panel">
            <div class="panel-header">
                <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg> Transactions</h2>
            </div>
            <div class="table-container">
                <table id="transactionsTable">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Type</th>
                            <th>Amount</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="transactionsBody"></tbody>
                </table>
                <div class="empty-state" id="emptyState">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>
                    <p>No transactions yet</p>
                    <span>Add your first transaction above</span>
                </div>
            </div>
        </section>

        <section class="glass panel chart-panel">
            <div class="panel-header">
                <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg> Spending Analysis</h2>
            </div>
            <div class="chart-container">
                <canvas id="expenseChart"></canvas>
                <div class="chart-legend" id="chartLegend"></div>
            </div>
        </section>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
